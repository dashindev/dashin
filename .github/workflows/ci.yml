name: CI

# Manual-only: CI runs ONLY when triggered by hand (Actions tab → Run workflow,
# or `gh workflow run ci.yml`). No automatic runs on push/PR — avoids spend on
# every commit. Run it deliberately before merging.
on:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Build all package lib/ (the plugin generator requires it)
      - run: yarn tsc:build
      - name: App type-check
        working-directory: packages/bunadmin
        run: yarn typecheck
      - name: Unit tests (Vitest)
        working-directory: packages/bunadmin
        run: yarn test
      - name: Production build (Vite)
        working-directory: packages/bunadmin
        run: yarn build

  # Heavy job (installs Playwright browsers). Manual-only like the rest; runs
  # when CI is triggered by hand.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc:build
      - name: Install Playwright browsers
        working-directory: packages/bunadmin
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        working-directory: packages/bunadmin
        run: yarn e2e
