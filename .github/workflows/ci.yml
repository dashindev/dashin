name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch: {} # allow manual runs

# Cancel superseded runs: pushing repeatedly to a branch/PR keeps only the
# latest run instead of running CI for every intermediate push (cost control).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Build all package lib/ (the plugin generator requires it)
      - run: yarn tsc:build
      - name: App type-check
        working-directory: packages/bunadmin
        run: yarn typecheck
      - name: Unit tests (Vitest)
        working-directory: packages/bunadmin
        run: yarn test
      - name: Production build (Vite)
        working-directory: packages/bunadmin
        run: yarn build

  # Heavy job (installs Playwright browsers): run on PRs only — the PR already
  # validates a branch before it reaches master, so re-running on the master
  # merge is redundant spend.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc:build
      - name: Install Playwright browsers
        working-directory: packages/bunadmin
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        working-directory: packages/bunadmin
        run: yarn e2e
