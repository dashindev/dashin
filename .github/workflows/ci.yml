name: CI

# Manual-only: CI runs ONLY when triggered by hand (Actions tab → Run workflow,
# or `gh workflow run ci.yml`). No automatic runs on push/PR — avoids spend on
# every commit. Run it deliberately before merging.
on:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Build all package lib/ (the plugin generator requires it)
      - run: yarn tsc:build
      - name: App type-check
        working-directory: packages/dashin
        run: yarn typecheck
      - name: Unit tests (Dashin)
        working-directory: packages/dashin
        run: yarn test
      - name: Unit tests (Payload source)
        working-directory: packages/dashin-source-payload
        run: yarn test
      - name: Unit tests (D1 source)
        working-directory: packages/dashin-source-d1
        run: yarn test
      - name: Production build (Vite)
        working-directory: packages/dashin
        run: yarn build
      - name: Documentation build
        run: npm ci --prefix docs && npm run build --prefix docs
      - name: Patch hygiene
        run: git diff --check

  # Heavy job (installs Playwright browsers). Manual-only like the rest; runs
  # when CI is triggered by hand.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc:build
      - name: Install Playwright browsers
        working-directory: packages/dashin
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        working-directory: packages/dashin
        run: yarn e2e

  # Consumer prod-build smoke: scaffold the Vite template against locally-packed
  # @dashin-dev/* tarballs, run a production `vite build`, and headless-load the
  # preview. Catches prod-only regressions unit tests can't (CJS init crashes,
  # i18n glob, unstyled shell). Manual-only like the rest.
  template-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc:build
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Template prod-build smoke (twice; verifies cleanup)
        run: |
          node scripts/smoke/template-prod-smoke.mjs
          node scripts/smoke/template-prod-smoke.mjs
