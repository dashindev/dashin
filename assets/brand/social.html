<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(51,102,255,0.30), transparent 60%),
      radial-gradient(800px 520px at 108% 118%, rgba(0,214,143,0.22), transparent 55%),
      linear-gradient(135deg, #0a0e1a 0%, #0e1430 55%, #0b1124 100%);
    color: #eef2fb;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(900px 600px at 50% 40%, #000 30%, transparent 80%);
  }
  .wrap { position: relative; width: 1060px; }
  .row { display: flex; align-items: center; gap: 28px; }
  .tile {
    width: 116px; height: 116px; border-radius: 28px; flex: none;
    background: linear-gradient(145deg, #3a6bff, #5e86ff);
    box-shadow: 0 18px 50px rgba(51,102,255,0.45), inset 0 2px 0 rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .tile span { color: #fff; font-size: 78px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .name { font-size: 132px; font-weight: 800; letter-spacing: -4px; line-height: 0.9; }
  .name b { color: #fff; }
  .name i { font-style: normal; color: #00d68f; }
  .tag { margin-top: 34px; font-size: 40px; font-weight: 600; color: #c7d0e6; letter-spacing: -0.5px; }
  .badges { margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap; }
  .pill {
    font-size: 24px; font-weight: 600; color: #aeb9d6;
    padding: 12px 22px; border-radius: 999px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
  }
  .foot { position: absolute; left: 110px; bottom: 48px; display: flex; align-items: center; gap: 16px; }
  .foot .dot { width: 12px; height: 12px; border-radius: 50%; background: #00d68f; box-shadow: 0 0 16px #00d68f; }
  .foot .url { font-size: 28px; font-weight: 700; color: #93a0c4; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="row">
      <div class="tile"><span>&raquo;</span></div>
      <div class="name"><b>Dash</b><i>in</i></div>
    </div>
    <div class="tag">The plugin-based React admin scaffold</div>
    <div class="badges">
      <div class="pill">Vite</div>
      <div class="pill">Tailwind CSS</div>
      <div class="pill">Headless UI</div>
      <div class="pill">GraphQL &amp; REST</div>
      <div class="pill">AI-assisted</div>
    </div>
  </div>
  <div class="foot"><span class="dot"></span><span class="url">dashin.dev</span></div>
</body>
</html>
